        if (contactWindow) {
          creatingContact = false;
          showNotice("Карточка нового контакта открыта в отдельной вкладке. После её закрытия поиск обновится автоматически.", "success");
          render();
          clearInterval(contactCreateWatchTimer);
          let checks = 0;
          contactCreateWatchTimer = window.setInterval(() => {
            checks += 1;
            if (contactWindow.closed) {
              clearInterval(contactCreateWatchTimer);
              contactCreateWatchTimer = 0;
              afterClose({ result: "close" });
            } else if (checks >= 3600) {
              clearInterval(contactCreateWatchTimer);
              contactCreateWatchTimer = 0;
            }
          }, 1000);
          return;
        }
        if (window.BX24?.openPath) window.BX24.openPath("/crm/contact/details/0/", afterClose);
        else throw new Error("Браузер заблокировал открытие карточки контакта.");
      } catch (error) {
        creatingContact = false;
        showNotice(error.message || "Не удалось открыть форму создания контакта.");
        render();
      }
    }
    form.addEventListener("click", (event) => {
      const toggle = event.target.closest?.("[data-external-purchases-toggle]");
      if (toggle) { externalPurchasesExpanded = !externalPurchasesExpanded; render(); return; }
      if (event.target.closest?.("[data-contact-linker-toggle]")) {
        contactLinkerExpanded = !contactLinkerExpanded;
        if (!contactLinkerExpanded) {
          clearTimeout(contactSearchTimer);
          contactSearchRequestId += 1;
          contactSearchLoading = false;
        }
        render();
        return;
      }
      if (event.target.closest?.("[data-contact-search]")) { runContactSearch(); return; }
      if (event.target.closest?.("[data-create-contact]")) { openContactCreator(); return; }
      const link = event.target.closest?.("[data-link-contact]");
      if (link) { linkContact(Number(link.dataset.linkContact)); return; }
      const unlink = event.target.closest?.("[data-unlink-contact]");
      if (unlink) unlinkContact(Number(unlink.dataset.unlinkContact));
    });
    form.addEventListener("change", (event) => {
      const input = event.target;
      if (input.closest('#wm-extended')) return;
      if (!(input instanceof HTMLInputElement) || !editing) return;
      clearNotice();
      if (input.dataset.group) toggle(input.dataset.group, input.value, input.checked);
      if (input.dataset.brandGroupToggle) {
        const groupId = input.dataset.brandGroupToggle;
        if (input.checked) openBrandGroups.add(groupId);
        else {
          openBrandGroups.delete(groupId);
          const matrixRows = mvp4Paths.filter((row) => finalGroupStorageId(row) === groupId && !row.isOtherBrand);
          const matrixBrandIds = new Set(matrixRows.map(finalItemStorageId));
          selections.finalItems = selections.finalItems.filter((id) => !matrixBrandIds.has(id));
          for (const id of matrixBrandIds) delete brandNotes[id];
        }
      }
      if (input.dataset.dynamicElement) {
        const elementId = input.dataset.dynamicElement;
        toggle("elements", elementId, input.checked);
        if (!input.checked) {
          const childTypes = new Set(mvp4Paths.filter((row) => row.elementId === elementId).map((row) => row.elementTypeId));
          selections.elementTypes = selections.elementTypes.filter((id) => !childTypes.has(id));
          if (deepTaxonomyEnabled) {
            const childGroups = new Set(mvp4Paths.filter((row) => row.elementId === elementId).map((row) => row.productGroupId).filter(Boolean));
            const childFinalItems = new Set(mvp4Paths.filter((row) => row.elementId === elementId).map(finalItemStorageId));
            selections.productGroups = selections.productGroups.filter((id) => !childGroups.has(id));
            selections.finalItems = selections.finalItems.filter((id) => !childFinalItems.has(id));
          }
        }
      }
      if (input.dataset.dynamicType) {
        const typeId = input.dataset.dynamicType;
        toggle("elementTypes", typeId, input.checked);
        if (!input.checked && deepTaxonomyEnabled) {
          const childGroups = new Set(mvp4Paths.filter((row) => row.elementTypeId === typeId).map((row) => row.productGroupId).filter(Boolean));
          const childFinalItems = new Set(mvp4Paths.filter((row) => row.elementTypeId === typeId).map(finalItemStorageId));
          selections.productGroups = selections.productGroups.filter((id) => !childGroups.has(id));
          selections.finalItems = selections.finalItems.filter((id) => !childFinalItems.has(id));
        }
      }
      if (input.dataset.dynamicGroup) {
        const groupId = input.dataset.dynamicGroup;
        if (!deepTaxonomyEnabled) return;
        toggle("productGroups", groupId, input.checked);
        if (!input.checked) {
          const childFinalItems = new Set(mvp4Paths.filter((row) => row.productGroupId === groupId).map(finalItemStorageId));
          selections.finalItems = selections.finalItems.filter((id) => !childFinalItems.has(id));
        }
      }
      if (input.dataset.finalItem) {
        const finalItemId = input.dataset.finalItem;
        if (!deepTaxonomyEnabled) return;
        toggle("finalItems", finalItemId, input.checked);
        if (!input.checked) {
          const childRows = mvp4Paths.filter((row) => row.matrixParentLeafId === finalItemId);
          const childIds = new Set(childRows.map(finalItemStorageId));
          selections.finalItems = selections.finalItems.filter((id) => !childIds.has(id));
          for (const id of childIds) delete brandNotes[id];
          for (const row of childRows) if (row.brandGroupId) openBrandGroups.delete(finalGroupStorageId(row));
        }
      }
      setTimeout(() => {
        render();
        stateLabel.textContent = "Есть несохранённые изменения";
        persistDraft();
      }, 0);
    });
    form.addEventListener("input", (event) => {
      if (!editing) return;
      if (event.target?.id === "contact-search") {
        contactSearchQuery = event.target.value;
        contactSearchResults = [];
        contactSearchCompletedQuery = "";
        contactSearchRequestId += 1;
        contactSearchLoading = false;
        clearTimeout(contactSearchTimer);
        if (contactSearchQuery.trim().length >= 2) contactSearchTimer = setTimeout(runContactSearch, 550);
        return;
      }
      if (event.target?.id === "company-feature") companyFeature = event.target.value;
      else if (event.target?.dataset?.brandKey) brandNotes[event.target.dataset.brandKey] = event.target.value;
      else if (event.target?.dataset?.contactRole) {
        const contactId = Number(event.target.dataset.contactRole);
        const contact = (passport.contacts || []).find((item) => Number(item.id) === contactId);
        if (contact) contact.role = event.target.value;
      } else return;
      clearNotice();
      stateLabel.textContent = "Есть несохранённые изменения";
      persistDraft();
    });
    form.addEventListener("keydown", (event) => {
      if (event.target?.id === "contact-search" && event.key === "Enter") { event.preventDefault(); clearTimeout(contactSearchTimer); runContactSearch(); }
    });
    async function load() {
      if (!companyId) throw new Error("Не удалось определить компанию. Откройте вкладку «Паспорт» из карточки компании.");
      const response = await fetch(`/api/passport?companyId=${companyId}&core=1`, { cache: "no-store" });
      const body = await response.json();
      if (!response.ok || !body.success) throw new Error(body.error?.message || "Не удалось загрузить паспорт.");
      passport = body.data;
      window.passportHistoryCard={ref:'CO_'+companyId,name:passport.company.title};
      parentRelation.load(body.data.relationship);
      extendedInfo.load(body.data.extendedInfo);
      adoptSelections(body.data.selections || {});
      brandNotes = adoptBrandNotes(structuredClone(body.data.brandNotes || {}));
      companyFeature = body.data.companyFeature || "";
      editing = !body.data.hasSavedPassport;
      editLockedBlocks = false;
      serverFingerprint = fingerprint();
      const restoredDraft = restoreDraft();
      document.querySelector("#title").textContent = `Паспорт · ${body.data.company.title}`;
      const fullName = document.querySelector("#company-full-name");
      fullName.textContent = body.data.company.fullName || "Реквизиты не заполнены";
      fullName.className = `company-full-name${body.data.company.fullName ? "" : " missing"}`;
      fullName.hidden = false;
      render();
      stateLabel.textContent = body.data.segment.isInstaller
        ? (restoredDraft ? "Восстановлен несохранённый черновик" : editing ? "Первичное заполнение — режим редактирования" : "Паспорт открыт для просмотра")
        : "Сегмент получен из 1С";
      document.body.classList.remove("loading");
      refreshCommercial();
      requestResize();
    }
    function startEditing() {
      if (saving || (editing && editLockedBlocks)) return;
      clearNotice();
      externalPurchasesExpanded = false;
      contactLinkerExpanded = false;
      editing = true;
      editLockedBlocks = true;
      render();
      stateLabel.textContent = "Режим редактирования";
    }
    for (const button of editButtons) button.addEventListener("click", startEditing);
    async function savePassport() {
      if (!editing || saving) return;
      const relationError=parentRelation.validate()||(passport.segment.isInstaller?extendedInfo.validate():null);if(relationError){showNotice(relationError);return;}
      clearNotice(); persistDraftNow(); saving = true; render(); stateLabel.textContent = "Сохранение…";
      try {
        normalizeSelections();
        const selectedFinalItems = new Set(selections.finalItems || []);
        brandNotes = Object.fromEntries(Object.entries(brandNotes).filter(([key, value]) => selectedFinalItems.has(key) && String(value || "").trim()));
        const contactRoles = (passport.contacts || []).map((item) => ({ id: Number(item.id), role: item.role || "" }));
        const emptySpecialization=['objects','works','contours','systems','elements','elementTypes','productGroups','finalItems'].every(k=>!(persistedSelections()[k]||[]).length);
        const confirmEmptyPassport=Boolean(passport.segment.isInstaller&&passport.hasSavedPassport&&emptySpecialization&&window.confirm('Вы вручную удалили все выбранные пункты паспорта. Сохранить пустые значения? Предыдущая версия останется в истории.'));
        if(passport.segment.isInstaller&&passport.hasSavedPassport&&emptySpecialization&&!confirmEmptyPassport){stateLabel.textContent='Очистка отменена';return;}
        const response = await fetch(`/api/passport?companyId=${companyId}`, { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ segmentKey:passport.segment.value,confirmEmptyPassport,baseRevision:passport.baseRevision,selections: persistedSelections(), brandNotes, companyFeature, contactRoles, relationship:parentRelation.snapshot(), extendedInfo:extendedInfo.snapshot() }) });
        const body = await response.json();
        if (!response.ok || !body.success) throw new Error(body.error?.message || "Не удалось сохранить паспорт.");
        const groupChanged = passport.relationship?.original !== body.data.relationship?.original;
        parentRelation.load(body.data.relationship);
        passport.relationship = body.data.relationship;
        passport.segment = body.data.segment || passport.segment;
        extendedInfo.load(body.data.extendedInfo);
        adoptSelections(body.data.selections || persistedSelections());
        brandNotes = adoptBrandNotes(structuredClone(body.data.brandNotes || brandNotes));
        companyFeature = body.data.companyFeature ?? companyFeature;
        passport.commercial = body.data.commercial || passport.commercial;
        if (groupChanged) passport.commercialGroup = null;
        if (Object.hasOwn(body.data, 'commercialGroup')) passport.commercialGroup = body.data.commercialGroup;
        const savedRoles = new Map((body.data.contactRoles || []).map((item) => [Number(item.id), item.role || ""]));
        for (const contact of (passport.contacts || [])) {
          if (savedRoles.has(Number(contact.id))) contact.role = savedRoles.get(Number(contact.id));
        }
        passport.hasSavedPassport = Boolean(body.data.hasSavedPassport);
        passport.baseRevision = body.data.baseRevision || passport.baseRevision;
        passport.lastEdit = body.data.lastEdit || passport.lastEdit;
        passport.progress = body.data.progress || passport.progress;
        editing = !passport.hasSavedPassport;
        editLockedBlocks = false;
        serverFingerprint = fingerprint();
        clearDraft();
        showNotice(passport.segment.isInstaller?"Паспорт компании, головная связь и роли контактов сохранены.":"Головная связь сохранена. Данные классификации не изменялись.", "success");
        stateLabel.textContent = "Изменения сохранены";
        refreshCommercial();
      } catch (error) { showNotice(error.message); stateLabel.textContent = "Ошибка сохранения"; }
      finally { saving = false; render(); requestResize(); }
    }
    for (const button of saveButtons) button.addEventListener("click", savePassport);

    function refreshCommercial() {
      const relation=JSON.stringify(passport.relationship);
      const updateDisplay=()=>{
        if(editing||saving){const card=form.querySelector('.commercial-card');if(card)card.outerHTML=renderCommercial();}
        else render();
        requestResize();
      };
      void fetch(`/api/passport?companyId=${companyId}&commercial=1`).then(async response=>{
        const refreshed=await response.json();
        if(!response.ok||!refreshed.success)throw new Error('Commercial unavailable');
        if(relation!==JSON.stringify(passport.relationship))return;
        passport.commercial=refreshed.data.commercial;
        passport.commercialGroup=refreshed.data.commercialGroup??null;
        updateDisplay();
      }).catch(()=>{
        if(relation!==JSON.stringify(passport.relationship)||!passport.commercial?.loading)return;
        passport.commercial={...passport.commercial,loading:false,historyUnavailable:true,salesPotentialUnavailable:true,realizationSummaryUnavailable:true};
        updateDisplay();
      });
    }

    let resizeQueued = false;
    function sendFrameSize(height) {
      const width = "100%";
      try { window.BX24?.resizeWindow(width, height); } catch {}
      try {
        const [domain, secure, appSid] = String(window.name || "").split("|");
        if (!domain || !appSid) return;
        const targetOrigin = `http${Number(secure) ? "s" : ""}://${domain.replace(/:(80|443)$/, "")}`;
        const params = { width, height };
        window.parent.postMessage({ method: "resizeWindow", params, callback: "", appSid }, targetOrigin);
        const message = `resizeWindow:${JSON.stringify(params)}::${appSid}`;
        window.parent.postMessage(message, targetOrigin);
      } catch {}
    }
    function frameHeightFloor() {
      const screenHeight = Math.max(
        Number(window.screen?.availHeight) || 0,
        Number(window.screen?.height) || 0,
        Number(window.innerHeight) || 0,
      );
      const interfaceReserve = Math.max(110, Math.min(190, Math.round(screenHeight * 0.12)));
      return Math.max(640, screenHeight - interfaceReserve);
    }
    function enforceFrameHeightFloor() {
      const floor = frameHeightFloor();
      document.documentElement.style.setProperty("--passport-frame-min-height", `${floor}px`);
      return floor;
    }
    function requestResize() {
      if (panelMode) {
        document.documentElement.style.setProperty("--passport-frame-min-height", "100vh");
        return;
      }
      if (resizeQueued) return;
      resizeQueued = true;
      requestAnimationFrame(() => {
        resizeQueued = false;
        const floor = enforceFrameHeightFloor();
        const scrollSize = window.BX24?.getScrollSize?.() || {};
        const contentHeight = Math.max(
          Number(scrollSize.scrollHeight) || 0,
          document.documentElement.scrollHeight,
          document.body.scrollHeight,
        );
        sendFrameSize(Math.ceil(Math.max(floor, contentHeight)));
      });
    }
    if (!panelMode && window.ResizeObserver) new ResizeObserver(requestResize).observe(document.body);
    function scheduleFrameResize() {
      if (panelMode) {
        document.documentElement.style.setProperty("--passport-frame-min-height", "100vh");
        return;
      }
      enforceFrameHeightFloor();
      try { window.BX24?.fitWindow?.(() => requestResize()); } catch {}
      requestResize();
      [100, 300, 800, 1500, 3000].forEach((delay) => setTimeout(requestResize, delay));
    }
    let installFinishRequested = false;
    function ensureInstallationFinished() {
      if (!window.BX24 || installFinishRequested) return;
      try {
        if (window.sessionStorage?.getItem("wmPassportInstalled") === "true") return;
        window.BX24.callMethod("app.info", {}, (result) => {
          try {
            if (result.error()) return;
            const installed = result.data()?.INSTALLED;
            if (installed === true) {
              window.sessionStorage?.setItem("wmPassportInstalled", "true");
              return;
            }
            if (installed !== false || installFinishRequested) return;
            installFinishRequested = true;
            window.BX24.installFinish();
          } catch {}
        });
      } catch {}
    }
    try {
      window.BX24?.init(() => {
        ensureInstallationFinished();
        scheduleFrameResize();
      });
    } catch {}
    scheduleFrameResize();
    window.addEventListener("load", () => {
      scheduleFrameResize();
    });
    window.addEventListener("resize", scheduleFrameResize);
    window.visualViewport?.addEventListener?.("resize", scheduleFrameResize);
    load().catch((error) => { document.body.classList.remove("loading"); stateLabel.textContent = "Паспорт не загружен"; showNotice(error.message); requestResize(); });
  </script>
