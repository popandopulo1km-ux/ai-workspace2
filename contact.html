<body>
  <main class="shell">
    <header>
      <div><h1 id="title">Паспорт контакта</h1><div id="contact-meta" class="contact-meta"></div></div>
      <div id="passport-progress" class="passport-progress" aria-live="polite"></div>
      <div class="header-side"><span class="badge">Бета-тест</span><div class="header-actions"><button class="secondary" data-edit disabled>Редактировать</button><button data-save disabled>Сохранить</button></div></div>
    </header>
    <div id="notice" class="notice"></div>
    <section id="form" class="grid"></section>
    <footer><span id="state" class="state">Загрузка…</span><div class="footer-actions"><button class="secondary" data-edit disabled>Редактировать</button><button data-save disabled>Сохранить</button></div></footer>
  </main>
  <script>
    const baseModel = {
      objects: { title: "Виды объектов", hint: "Выберите объекты, с которыми работает контакт.", values: [["izhs", "ИЖС"], ["mkd", "МКД"]] },
      contours: { title: "Контур работ", hint: "С этого поля начинается зависимая часть паспорта.", values: [["internal", "Внутренние системы"], ["external", "Наружные сети"]] },
      works: { title: "Виды выполняемых работ", hint: "Можно выбрать несколько фактических компетенций контакта.", values: [["installation", "Монтаж"], ["commissioning", "Пусконаладочные работы"], ["repair", "Ремонт"], ["putting_into_operation", "Ввод в эксплуатацию"], ["technical_solutions", "Разработка и предоставление технических решений"]] },
    };
    const contourLabels = { internal: "Внутренние системы", external: "Наружные сети" };
    const paths = Array.isArray(window.PASSPORT_TAXONOMY?.paths) ? window.PASSPORT_TAXONOMY.paths : [];
    const form = document.querySelector("#form");
    const stateLabel = document.querySelector("#state");
    const notice = document.querySelector("#notice");
    const progressElement = document.querySelector("#passport-progress");
    const parentRelation=createPassportParent({changed:()=>{saveDraft();stateLabel.textContent='Есть несохранённые изменения';}});
    const extendedInfo=createPassportExtendedInfo({changed:()=>{saveDraft();stateLabel.textContent='Есть несохранённые изменения';window.passportPurchaseRelationship=JSON.stringify(passport.relationship);window.passportPurchaseSnapshot={isInstaller:passport.segment.isInstaller,selections:structuredClone(selections),answers:extendedInfo.snapshot().answers};window.dispatchEvent(new Event("passport-purchase-change"));}});
    const editButtons = [...document.querySelectorAll("[data-edit]")];
    const saveButtons = [...document.querySelectorAll("[data-save]")];
    const params = new URLSearchParams(location.search);
    const placementCode=params.get('placement')||params.get('PLACEMENT')||'';
    document.documentElement.classList.toggle('panel-mode',params.get('panelMode')==='1'||placementCode==='CRM_CONTACT_DETAIL_ACTIVITY');
    let placementOptions={}; try { placementOptions=JSON.parse(params.get('placement_options')||params.get('PLACEMENT_OPTIONS')||'{}'); }catch{}
    let contactId=Number(params.get('contactId')||placementOptions.ID||placementOptions.ENTITY_ID);
    let draftKey = `wmPassportDraft:contact:${contactId}`;
    const apiUrl = (suffix='') => `/api/passport/contact${suffix}${suffix.includes('?')?'&':'?'}contactId=${contactId}`;
    let originals = new Map();
    let passport;
    let selections = {};
    let editing = true;
    let editLockedBlocks = false;
    let saving = false;
    let changingCompanyLink = false;
    let role = "";
    let companies = [];
    let linkerExpanded = false;
    let searchQuery = "";
    let searchResults = [];
    let searchLoading = false;
    let searchCompleted = "";
    let searchTimer = 0;
    let searchRequest = 0;

    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (symbol) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[symbol]));
    const money = (value) => new Intl.NumberFormat("ru-RU", { style: "currency", currency: "RUB", maximumFractionDigits: 0 }).format(Number(value) || 0);
    const has = (group, id) => (selections[group] || []).includes(id);
    function toggle(group, id, checked) {
      const values = new Set(selections[group] || []);
      checked ? values.add(id) : values.delete(id);
      selections[group] = [...values];
    }
    function showNotice(text, kind = "error") { notice.textContent = text; notice.className = `notice show ${kind}`; }
    function clearNotice() { notice.textContent = ""; notice.className = "notice"; }
    function snapshot() { return { baseRevision:passport.baseRevision,selections, role, relationship:parentRelation.snapshot(), extendedInfo:extendedInfo.snapshot(), companyFeatures: companies.map((item) => ({ id: item.id, feature: item.feature, original: originals.get(item.id) ?? item.feature })) }; }
    function saveDraft() { if (editing) {try{localStorage.setItem(draftKey, JSON.stringify(snapshot()));}catch{showNotice('Не удалось сохранить резервный черновик в браузере. Не закрывайте страницу до сохранения.');}} }

    // Compare editable business values, not revision tokens or relation labels.
    function draftContent(value) {
      const v=structuredClone(value||{});
      delete v.baseRevision; delete v.baseFingerprint;
      if(v.relationship){const h=v.relationship.head;v.relationship={role:v.relationship.role||null,head:h?{type:h.type,id:Number(h.id)}:null};}
      if(v.extendedInfo){delete v.extendedInfo.revision;delete v.extendedInfo.activeQuestionIds;}
      if(v.companyFeatures)v.companyFeatures=v.companyFeatures.map(x=>({id:Number(x.id),feature:x.feature||''}));
      const stable=x=>Array.isArray(x)?x.map(stable).sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b))):x&&typeof x==='object'?Object.fromEntries(Object.keys(x).sort().map(k=>[k,stable(x[k])])):x;
      return JSON.stringify(stable(v));
    }
    function archiveDraft(raw) {
      // Archive first; a storage failure must never destroy an unsaved edit.
      localStorage.setItem(draftKey+':stale:'+Date.now(),raw);
      localStorage.removeItem(draftKey);
    }
    function restoreDraft() {
      try {
        const draft = JSON.parse(localStorage.getItem(draftKey) || "null");
        if (!draft) return false;
        if(draftContent(draft)===draftContent(snapshot())){archiveDraft(JSON.stringify(draft));return false;}
        if(draft.baseRevision!==passport.baseRevision){
          archiveDraft(JSON.stringify(draft));
          showNotice('В браузере остались несохранённые изменения прежней версии. Они сохранены отдельно. Открыты актуальные данные паспорта; старые изменения их не заменили.','warning');
          return false;
        }
        selections = { ...selections, ...(draft.selections || {}) };
        role = draft.role ?? role;
        parentRelation.restore(draft.relationship);
        extendedInfo.load(draft.extendedInfo);
        const features = new Map((draft.companyFeatures || []).map((item) => [Number(item.id), item.feature]));
        companies.forEach((item) => { if (features.has(Number(item.id))) item.feature = features.get(Number(item.id)); });
        editing=true;
        editLockedBlocks=true;
        return true;
      } catch { showNotice('Не удалось обработать резервный черновик. Он оставлен в браузере без изменений.','warning'); return false; }
    }
    function rowsForSystem(systemId) {
      if (systemId === "water_treatment" && !(selections.objects || []).includes("izhs")) return [];
      let result = paths.filter((row) => row.systemId === systemId);
      if (["heating", "water_treatment"].includes(systemId)) {
        const objects = new Set(selections.objects || []);
        result = result.filter((row) => row.objectId && objects.has(row.objectId));
      }
      return result;
    }

        if(relation!==JSON.stringify(passport.relationship))return;
        passport.commercial=refreshed.data.commercial;
        passport.commercialGroup=refreshed.data.commercialGroup??null;
        updateDisplay();
      }).catch(()=>{
        if(relation!==JSON.stringify(passport.relationship)||!passport.commercial?.loading)return;
        passport.commercial={...passport.commercial,loading:false,historyUnavailable:true,salesPotentialUnavailable:true,realizationSummaryUnavailable:true};
        updateDisplay();
      });
    }
    function mergeCompanies(next) {
      const unsaved=new Map(companies.map(c=>[c.id,c]));
      companies=next.map(c=>{const old=unsaved.get(c.id);if(!originals.has(c.id))originals.set(c.id,c.feature);return old&&old.feature!==originals.get(c.id)?{...c,feature:old.feature}:c;});
    }
    window.addEventListener('beforeunload',saveDraft);
    let started = false;
    const start=()=>{
      if (started) return;
      started = true;
      load().catch((error)=>{showNotice(error.message);stateLabel.textContent='Ошибка загрузки';});
    };
    // VibeCode opens the application inside an additional wrapper iframe. In that
    // layout BX24.init may be delayed indefinitely, while placement_options is
    // already present in the URL. Do not block loading on the SDK callback when
    // the contact id is known.
    if (contactId) start();
    else if(window.BX24)BX24.init(()=>{try{const info=BX24.placement.info();contactId=Number(info.options?.ID||info.options?.ENTITY_ID);draftKey=`wmPassportDraft:contact:${contactId}`;}catch{}start();});
    else start();
  </script>
